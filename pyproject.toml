[project]
name = "gpu-cutcell-navier-stokes"
version = "0.1.0"
description = "High-order B-spline summation-by-parts cut-cell Navier-Stokes: polynomial-preserving aggregation, GPU sparse PCG, CUDA kernels"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Yong Yi Bay" },
  { name = "Kathleen A. Yearick" },
]
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=2.0",
  "scipy>=1.14",
  "cycler>=0.12",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.0",
]
gpu = [
  "cupy-cuda12x>=14.1.1",
  "nvidia-cublas-cu12>=12.9.2.10",
  "nvidia-cuda-nvrtc-cu12>=12.9.86",
  "nvidia-cuda-runtime-cu12>=12.9.79",
  "nvidia-cufft-cu12>=11.4.1.4",
  "nvidia-curand-cu12>=10.3.10.19",
  "nvidia-cusolver-cu12>=11.7.5.82",
  "nvidia-cusparse-cu12>=12.5.10.65",
  "nvidia-nvjitlink-cu12>=12.9.86",
]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
